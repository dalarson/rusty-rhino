spring.application.name=${SPRING_APPLICATION_NAME:rusty-api}
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=-1

# Auth
auth.jwt.secret=${JWT_SECRET:rusty-rhino-dev-secret-change-in-production-min32bytes}
auth.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Admin users: add auth.admin.userN.username/password for as many users as needed
auth.admin.user1.username=${ADMIN_USER_1:}
auth.admin.user1.password=${ADMIN_PASS_1:}
auth.admin.user2.username=${ADMIN_USER_2:}
auth.admin.user2.password=${ADMIN_PASS_2:}
auth.admin.user3.username=${ADMIN_USER_3:}
auth.admin.user3.password=${ADMIN_PASS_3:}
auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Inquiry notification email (SMTP). Leave MAIL_HOST empty to disable sending.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
inquiry.notify.to=${INQUIRY_NOTIFY_TO:annmarielarson3@yahoo.com}
inquiry.notify.from=${INQUIRY_NOTIFY_FROM:${MAIL_USERNAME:}}
inquiry.site-url=${SITE_URL:http://localhost:5173}

# Logging
logging.level.com.rusty_rhino.rusty_api.auth=DEBUG